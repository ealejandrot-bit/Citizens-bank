# Parámetros de la base sintética Client Pulse.
# Cada supuesto lleva su origen: [Excel] hoja del Excel, [Deck] slide del deck,
# [Supuesto] valor nuestro pendiente de validar con Citizens (ver docs/decisiones.md).

master_seed: 20260928          # Única semilla del proyecto; todo deriva de aquí.
n_households: 20000            # [Supuesto] Tamaño suficiente para IV/WoE y ML estable.
snapshot_date: "2025-12-31"    # [Excel · Base definitions] t = corte mensual.
currency: USD                  # Banco de EE. UU.: todos los montos en dólares nominales, sin FX.

# ---------------------------------------------------------------------------
# Paso 0 · Población de hogares
# ---------------------------------------------------------------------------
population:
  # Valor total de la relación (AUM + depósitos) ~ LogNormal.
  # Mediana $4M, sigma 1.2 -> media ≈ $8.2M, cola pesada (UHNW ≈ 4-5%).
  relationship_value_median: 4_000_000     # [Supuesto]
  relationship_value_sigma: 1.2            # [Supuesto]
  relationship_value_min: 1_000_000        # [Supuesto] piso de Private Bank.
  uhnw_threshold: 30_000_000               # [Deck · slide 69] "UHNW (above $30M)".
  # Cola Pareto sobre el umbral UHNW (riqueza real ≈ Pareto, α ≈ 1.5). Se conserva
  # P(valor ≥ $30M) de la LogNormal; por encima, Pareto truncada en [$30M, tope].
  pareto_tail_alpha: 1.5                   # [Supuesto] ajuste D-13.
  pareto_tail_max: 1_000_000_000           # [Supuesto] tope: evita varianza infinita.

  # Hogares sin cuentas de inversión (solo depósitos): variables de
  # inversión quedan NULL, no cero [Excel · Base definitions "Null vs. zero"].
  # P(solo depósitos) cae con el patrimonio (ajuste D-13):
  # logit p = logit(p_en_mediana) + pendiente · lv, con lv = log-valor estandarizado.
  # ≈ 31% a $1M, 15% a $4M, 4% a $30M.
  deposit_only_p_at_median: 0.15           # [Supuesto]
  deposit_only_slope: -0.80                # [Supuesto]
  # Proporción de depósitos en hogares con inversión ~ Beta(a, b) (media ≈ 0.29).
  deposit_share_beta: [2.0, 5.0]           # [Supuesto]

  # Edad del titular principal ~ Normal truncada.
  age_mean: 61                             # [Supuesto]
  age_sd: 12                               # [Supuesto]
  age_bounds: [28, 95]

  # Antigüedad con el banco (años) ~ Gamma(shape, scale), media = shape*scale.
  tenure_gamma: [2.0, 4.5]                 # [Supuesto] media 9 años.
  tenure_max_years: 50                     # [Supuesto] tope de cola.
  # Meses de historia disponible para la base: min(tenure, 24m) [Deck · slide 20].
  history_months_cap: 24

  # Entidades vinculadas [Excel · Base definitions "Aggregation level"].
  # Probabilidad base y aumento para UHNW.
  p_linked_business: 0.25                  # [Supuesto]
  p_linked_business_uhnw: 0.55             # [Supuesto]
  p_trust: 0.30                            # [Supuesto]
  p_trust_uhnw: 0.70                       # [Supuesto]
  # Cuentas advisory (con benchmark asignado) entre hogares con inversión.
  p_advisory_given_investments: 0.70       # [Supuesto]
  # Crédito con Citizens (hipoteca / línea) = "credit anchor" [Deck · slide 26].
  p_credit_anchor: 0.35                    # [Supuesto]

  # Perfil de ingresos recurrentes (determina a quién aplican las variables
  # salary_/pension_/business_payroll_stopped_flag).
  p_payroll_if_working: 0.80               # [Supuesto] trabajan: edad < retirement_age.
  p_payroll_if_retired: 0.10               # [Supuesto]
  p_pension_if_retired: 0.85               # [Supuesto]
  p_pension_if_working: 0.05               # [Supuesto]
  p_dividend_stream_given_investments: 0.55  # [Supuesto]
  retirement_age: 65                       # [Supuesto]

# ---------------------------------------------------------------------------
# Paso 0 · Montos de ingreso (Private Banking: ingresos altos)
# ---------------------------------------------------------------------------
# Todos los montos crecen con el patrimonio: ln(monto) = ln(mediana) +
# ρ·σ·lv + σ·√(1−ρ²)·ε, con lv = log-valor de la relación estandarizado.
# Así ρ ≈ correlación entre log-ingreso y log-patrimonio. Los pisos se aplican
# remuestreando ε (no recortando, para no apilar masa en el piso).
income:
  # Sueldo base anual de quienes reciben nómina en Citizens.
  salary_base_median: 350_000              # [Supuesto] profesionales / ejecutivos PB.
  salary_sigma: 0.55                       # [Supuesto] p5 ≈ $150k, p95 ≈ $850k antes del ajuste por patrimonio.
  salary_wealth_corr: 0.45                 # [Supuesto]
  salary_min: 150_000                      # [Supuesto] piso de nómina PB.
  # Bono anual como % del sueldo base = bonus_max × Beta(a, b) (media ≈ 50%).
  # Llega en un solo pago al año: rompe la regularidad de la nómina y la
  # detección de flujos recurrentes debe tratarlo aparte (Paso 2).
  # Ajuste D-13: masa de "sin bono" (bono = 0, no NULL) y piso para quien sí recibe.
  # Bono = sueldo × [min + (max − min) · Beta(a, b)]  → media ≈ 57% entre quienes reciben.
  p_no_bonus: 0.25                         # [Supuesto] médicos, abogados socios, etc.
  bonus_share_min: 0.10                    # [Supuesto]
  bonus_share_beta: [1.5, 3.0]             # [Supuesto]
  bonus_share_max: 1.5                     # [Supuesto]
  pay_frequency: {biweekly: 0.40, semimonthly: 0.45, monthly: 0.15}   # [Supuesto]
  # Pensión mensual: Social Security (máx ≈ $5k) + pensión privada / anualidad.
  pension_monthly_median: 9_000            # [Supuesto]
  pension_sigma: 0.50                      # [Supuesto]
  pension_wealth_corr: 0.30                # [Supuesto]
  pension_monthly_min: 2_500               # [Supuesto]
  # Dividendos = AUM × rendimiento ~ Beta (media 2%), pagos trimestrales.
  dividend_yield_beta: [4.0, 196.0]        # [Supuesto]
  # Distribuciones anuales del negocio vinculado al dueño (trimestrales, irregulares).
  business_distribution_median: 500_000    # [Supuesto]
  business_distribution_sigma: 0.90        # [Supuesto]
  business_distribution_wealth_corr: 0.50  # [Supuesto]

# ---------------------------------------------------------------------------
# Paso 0 · Estructura latente de riesgo (tres trayectorias del deck)
# ---------------------------------------------------------------------------
# [Deck · slide 24] Trayectorias: outflow-led, silent drift, service-triggered.
# Cada hogar tiene tres factores latentes N(0,1) correlacionados. Las variables
# de los pasos siguientes se generan desde estos factores + ruido propio; el
# target también. Nunca se generan variables a partir del target (evita fuga).
latent:
  factors: [outflow, neglect, service]
  correlation:                             # [Supuesto] correlación moderada
    - [1.00, 0.35, 0.25]
    - [0.35, 1.00, 0.30]
    - [0.25, 0.30, 1.00]
  # Peso de cada factor en el índice de riesgo.
  risk_weights: {outflow: 0.60, neglect: 0.45, service: 0.35}   # [Supuesto]
  # Desplazamientos estructurales (en unidades del índice de riesgo).
  tenure_effect_per_log_year: -0.15        # [Supuesto] más antigüedad -> menos riesgo.
  credit_anchor_effect: -0.20              # [Supuesto] [Deck · slide 26]
  uhnw_effect: 0.10                        # [Supuesto] ligero, para que AUM churn ≠ logo churn.
  # Riesgo idiosincrático no observable: limita el AUC alcanzable (score realista).
  idiosyncratic_sd: 0.60                   # [Supuesto]

# ---------------------------------------------------------------------------
# Distribuciones comunes a los pasos 1+
# ---------------------------------------------------------------------------
distributions:
  # Ruido de colas pesadas de los cambios % y flujos: t-Student estandarizada a
  # varianza 1. ν = 6 (D-11): curtosis de exceso 3, finita y estable. ν = 4 da infinita.
  t_df: 6

# ---------------------------------------------------------------------------
# Paso 0 · Target
# ---------------------------------------------------------------------------
target:
  # [Deck · slide 17] Ejemplo: 3% logo churn por trimestre; score medio 8% a 6m.
  hard_churn_6m_rate: 0.06                 # [Supuesto anclado al deck]
  hard_churn_slope: 1.6                    # [Supuesto] pendiente logística sobre el índice.
  # [Deck · slide 16/23] Soft churn = caída de AUM > umbral en 3m, sin salida total.
  soft_churn_threshold: 0.20               # [Deck] "AUM drop >20%" (a validar).
  soft_churn_3m_rate: 0.09                 # [Supuesto] sobre hogares elegibles; hard y soft son excluyentes.
  soft_churn_slope: 1.2                    # [Supuesto]
  # Fracción de la relación perdida en soft churn ~ Uniforme.
  soft_churn_loss_range: [0.20, 0.60]
  # Exclusiones (no cuentan como churn) [Deck · slide 59]: muerte, reubicación
  # gestionada por Legacy. Se marcan y su target queda NULL.
  exclusion_rate: 0.006                    # [Supuesto]

# ---------------------------------------------------------------------------
# Evento de salida común a los Pasos 1+ · mudanza del banco principal (D-14, D-17)
# ---------------------------------------------------------------------------
# Precursor directo de la salida: depende de la propensión total a irse (índice de
# riesgo del Paso 0). Se sortea UNA vez y lo usan todos los pasos, para que el mismo
# hogar muestre a la vez: nómina que deja de llegar (Paso 2), saldo que cae (Paso 1)
# y transferencias al banco nuevo (Paso 3). Los flujos de semilla conservan el nombre
# "s2.move*" para no alterar lo ya generado.
exit_move:
  move_intercept: -7.6                     # [Calibrado] ≈ 5% de hogares
  move_slope: 4.2                          # [Calibrado]
  move_window_days: 180
  p_stop_given_move: {payroll: 0.85, pension: 0.45, dividend: 0.30, business_distribution: 0.40}
  # Traslado de saldos al banco nuevo (dólares que salen de la serie del Paso 1).
  deposit_transfer_p: 0.90                 # [Supuesto]
  deposit_transfer_share: [0.30, 0.90]     # [Supuesto] fracción del saldo de depósitos
  deposit_tranches: [2, 6]                 # [Supuesto] tramos mensuales consecutivos desde el mes de la mudanza (D-18)
  aum_transfer_p: 0.80                     # [Calibrado] ACATS, entre hogares con inversiones (D-18)
  aum_transfer_share: [0.20, 0.80]         # [Supuesto] fracción del AUM
  acats_lag_days: [0, 120]                 # [Calibrado] el ACATS llega semanas o meses después (D-18)

# ---------------------------------------------------------------------------
# Paso 1 · Balances & AUM (series mensuales → variables 1, 2, 17, 18)
# ---------------------------------------------------------------------------
# Serie de 24 meses (m = −23..0; 0 = mes que cierra en t), anclada al Paso 0:
# el saldo de depósitos y el AUM del mes 0 son los del Paso 0. Se simula hacia
# atrás, así ningún valor del Paso 0 cambia. Ventanas del Excel en días →
# meses: 30d = 1, 90d = 3, 180d = 6, línea base (t−210d, t−30d] = meses −6..−1.
step1:
  months: 24
  min_balance_for_pct: 10_000              # [Excel · Parameters] saldo mínimo para %.
  # Depósitos: incrementos log mensuales = μ + σ · t(ν) estandarizada.
  deposit_drift_monthly: 0.002             # [Supuesto]
  deposit_sigma_monthly: 0.12              # [Calibrado] volatilidad del saldo PB (D-18)
  # Mercado común a todos los hogares (una draw por mes): μ + σ · t(ν) estandarizada.
  market_mu_monthly: 0.006                 # [Supuesto] ≈ 7% anual.
  market_sigma_monthly: 0.040              # [Supuesto] ≈ 14% anual.
  equity_share_range: [0.30, 1.00]         # [Supuesto] beta del portafolio al mercado.
  non_equity_return_monthly: 0.003         # [Supuesto] renta fija / cash.
  idio_return_sigma: 0.010                 # [Supuesto]
  # Alpha anual del portafolio (neto de comisiones), D-19: el factor S ("servicio y valor
  # percibido") incluye el bajo rendimiento. alpha = −comisión + habilidad − κ · z_service.
  advisory_fee_annual: 0.010               # [Supuesto] cuentas advisory
  fund_expense_annual: 0.002               # [Supuesto] resto
  manager_skill_sigma_annual: 0.015        # [Supuesto]
  alpha_service_loading_annual: 0.020      # [Calibrado] κ: por 1 d.e. de z_service
  # Flujos de fondo del AUM (fracción del AUM del mes previo), tipo hurdle.
  contribution_p: 0.12                     # [Supuesto] P(aporte en el mes)
  contribution_median: 0.02                # [Supuesto]
  withdrawal_p: 0.20                       # [Supuesto] retiros para gasto corriente
  withdrawal_median: 0.01                  # [Supuesto]
  flow_sigma: 0.80                         # [Supuesto] σ log de los montos
  # Episodio de salida (SEÑAL): P = logit⁻¹(a + b · z_outflow), duración 1–6 meses
  # hasta t, intensidad mensual δ ~ LogNormal. Afecta depósitos y AUM.
  episode_intercept: -4.0                  # [Calibrado] tasa base de episodios (recalibrado con la mudanza, D-17)
  episode_slope: 1.4                       # [Calibrado] fuerza predictiva (IV)
  episode_max_months: 6
  episode_delta_median: 0.12               # [Calibrado] ≈ 12% mensual antes del multiplicador de canal
  episode_delta_sigma: 0.50
  episode_channel_range_deposit: [1.0, 2.0] # [Calibrado] multiplicador de δ en depósitos
  episode_channel_range_aum: [0.3, 1.1]    # [Calibrado] multiplicador de δ en AUM
  # Choque de liquidez (RUIDO, independiente del riesgo): impuestos, compra de casa.
  shock_p_12m: 0.10                        # [Supuesto]
  shock_size_median: 0.25                  # [Supuesto] fracción que sale en el mes
  shock_size_sigma: 0.50
  shock_hits_aum_p: 0.50                   # [Supuesto]
  # Objetivos de calibración. Alerta = umbral ilustrativo del Excel; la tasa es un rango
  # porque aum_outflow_pct (retiros brutos ÷ AUM promedio) siempre alerta más que
  # aum_vs_baseline_pct (caída neta ex-mercado) ante el mismo episodio.
  # IV "High" del Excel → [0.10, 0.30] contra hard_churn_6m.
  targets:
    aum_outflow_pct_90d:            {alert: "> 0.10",   rate: [0.04, 0.16], iv: [0.10, 0.30]}
    deposit_balance_change_pct_90d: {alert: "<= -0.25", rate: [0.04, 0.16], iv: [0.10, 0.30]}
    aum_vs_baseline_pct:            {alert: "<= -0.20", rate: [0.04, 0.16], iv: [0.10, 0.30]}
    deposit_balance_vs_6m_avg_pct:  {alert: "<= -0.30", rate: [0.04, 0.16], iv: [0.10, 0.30]}

# ---------------------------------------------------------------------------
# Paso 2 · Recurring deposits & flows (variables 3, 4, 5, 6, 19, 20)
# ---------------------------------------------------------------------------
# Se simula cada depósito recurrente con su fecha (calendario real, días hábiles)
# en los 18 meses previos a t, y encima se corre el algoritmo de detección del
# Excel. Ningún flag se sortea directamente.
step2:
  history_days: 548                        # 18 meses de transacciones.
  net_pay_ratio_salary: 0.62               # [Supuesto] neto / bruto (impuestos PB + 401k).
  net_pay_ratio_pension: 0.85              # [Supuesto]
  amount_noise_sd: 0.01                    # [Supuesto] variación del monto por pago.
  dividend_amount_noise_sd: 0.10           # [Supuesto]
  business_distribution_amount_noise_sd: 0.35  # [Supuesto] distribuciones irregulares.
  late_payment_p: 0.03                     # [Supuesto] pago corrido 1–3 días hábiles.
  missed_payment_p_per_year: 0.01          # [Supuesto] un pago que no llega.
  bonus_months: [2, 3, 12]                 # [Supuesto] mes del bono (feb, mar, dic).
  business_payroll_frequency: {biweekly: 0.60, semimonthly: 0.40}   # [Supuesto]

  # SEÑAL "High" · redirección parcial del ingreso (sigue llegando una parte):
  # P = logit⁻¹(a + b · z_outflow); el monto cae a factor × monto desde la fecha.
  partial_intercept: -3.8                  # [Calibrado]
  partial_slope: 1.5                       # [Calibrado]
  partial_factor_range: [0.20, 0.60]
  # SEÑAL · el negocio vinculado mueve su operación (nómina del negocio) a otro banco.
  business_move_intercept: -5.0            # [Calibrado]
  business_move_slope: 3.0                 # [Calibrado]

  # RUIDO y EXCLUSIONES (independientes del riesgo).
  job_change_p_12m: 0.05                   # [Supuesto]
  job_change_ratio_sigma: 0.35             # [Supuesto] nuevo sueldo / anterior ~ LogNormal(0, σ)
  job_change_gap_days: [0, 45]
  retirement_p_12m: 0.10                   # [Supuesto] titulares de 60 a 67 años con nómina
  retirement_age_range: [60, 67]
  retirement_reported_p: 0.80              # [Supuesto] si se reporta → exclusión
  leave_p_12m: 0.01                        # [Supuesto] licencia (60–120 días sin nómina)
  leave_reported_p: 0.70
  death_reported_p: 0.80                   # hogares excluidos del target (Paso 0)
  business_sale_p_12m: 0.015               # [Supuesto] venta del negocio → exclusión

  # Algoritmo de detección [Excel · Detailed logic + Parameters].
  detection:
    min_occurrences: 3
    cv_max: 0.25
    payroll_lookback_days: 180             # ≥ 3 en 6 meses (nómina)
    recurring_lookback_days: 365           # ≥ 3 en 12 meses (otros flujos)
    stop_days_min: 45
    stop_interval_multiple: 1.5
    min_stream_weight: 0.10
    replacement_min_ratio: 0.50
    bonus_multiple: 2.0                    # crédito > 2× la mediana del originador = bono (se excluye)
    business_stop_days: 60

  # IV: los flags que solo existen en una subpoblación (nómina, pensión, negocio) se
  # calibran con IV condicional (entre hogares donde aplica); el resto sobre todos.
  # Motor de cada variable (D-14): "propensión" = índice de riesgo total (precursor
  # directo de salida); "factor" = z_outflow. Solo las de motor "factor" deben ser
  # independientes del riesgo no observable ε.
  targets:
    salary_deposit_stopped_flag:    {alert: "= 1",      rate: [0.02, 0.08], iv: [0.30, 0.50], strength: Very high, iv_base: applicable, driver: propensity}
    recurring_deposit_stopped_flag: {alert: "= 1",      rate: [0.03, 0.10], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: propensity}
    recurring_deposit_change_pct:   {alert: "<= -0.40", rate: [0.03, 0.12], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed}
    # Sale de la serie de depósitos del Paso 1 (volatilidad PB 12% mensual + mudanza → motor mixto).
    # Con el umbral ilustrativo del Excel (−15%) alerta ≈ 28%: hallazgo para recalibrar el umbral (D-18).
    net_deposit_flow_pct_90d:       {alert: "<= -0.15", rate: [0.06, 0.32], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed}
    pension_deposit_stopped_flag:   {alert: "= 1",      rate: [0.01, 0.06], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: propensity}
    business_payroll_stopped_flag:  {alert: "= 1",      rate: [0.02, 0.08], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: factor}

# ---------------------------------------------------------------------------
# Paso 3 · Transfers (variables 7, 8, 21, 22, 23, 24, 25)
# ---------------------------------------------------------------------------
# Transferencias externas simuladas una por una (18 meses). Las salidas vienen de la
# mudanza (evento común), los episodios y choques del Paso 1, transferencias de fondo
# y destinos nuevos esporádicos; las entradas cierran la identidad contable del saldo
# del Paso 1. También se simulan los pagos que el Excel excluye (billers, IRS,
# donaciones recurrentes, préstamos con Citizens) para probar que la exclusión funciona.
step3:
  history_days: 548
  # Pisos Private Banking (el Excel propone $1,000 y $10,000; D-18).
  outflow_baseline_floor_monthly: 10_000
  new_destination_min_cumulative: 50_000
  lookback_new_destination_days: 365
  # Catálogo sintético de instituciones (sin nombres reales). Competidores = bancos;
  # brokers / wealth managers van en catálogo aparte [Excel · #21].
  institutions: {private_bank: 15, national_bank: 6, regional_bank: 25, digital_bank: 10,
                 broker_wealth: 20, credit_union: 10, title_escrow: 15, other: 10}
  aba_per_institution: [1, 3]
  competitor_types: [private_bank, national_bank, regional_bank, digital_bank]
  # Cash dentro de cuentas de inversión (denominador de #7): Beta(2, 18) ≈ 10% del AUM.
  investment_cash_share_beta: [2.0, 18.0]
  # Destinos habituales del hogar (cuentas propias, familia, broker).
  regular_payees_poisson: 1.5              # nº = 1 + Poisson
  regular_payee_types: {national_bank: 0.35, regional_bank: 0.15, broker_wealth: 0.25, digital_bank: 0.10,
                        credit_union: 0.05, other: 0.10}
  # Fondo: fracción mensual del saldo que sale a destinos habituales (compensada con entradas).
  background_transfers_per_month: 4
  background_monthly_share_median: 0.005   # [Calibrado]
  background_monthly_share_sigma: 0.50
  background_amount_sigma: 0.40
  # Ruido: destino nuevo esporádico (contratista, colegiatura, compra puntual).
  one_off_p_month: 0.02                    # [Calibrado]
  one_off_amount_median: 15_000            # [Supuesto]
  one_off_amount_sigma: 1.0
  one_off_types: {title_escrow: 0.20, other: 0.40, regional_bank: 0.15, national_bank: 0.15, broker_wealth: 0.10}
  shock_real_estate_p: 0.60                # choque del Paso 1: compra de casa (title/escrow); si no, IRS (excluido)
  # Episodio del Paso 1: a dónde va el dinero. "spending" = la caída del saldo es gasto
  # (tarjeta, cheques): no genera transferencia externa y el AUM retirado pasa a depósitos.
  episode_destination: {spending: 0.45, competitor_bank: 0.22, broker: 0.23, existing_payee: 0.10}
  acats_to_broker_p: 0.70                  # el resto va al brazo wealth del banco nuevo
  # Pagos excluidos por el Excel.
  billers_per_month: 3
  biller_amount_median: 2_500
  biller_amount_sigma: 1.0
  estimated_tax_rate: 0.30                 # IRS: pagos estimados trimestrales ≈ 30% del ingreso / 4
  donation_p: 0.30
  donation_monthly_median: 2_000
  loan_payment_median: 8_000               # hogares con crédito ancla (pago a Citizens)
  card_spending_share_of_income: [0.20, 0.50]   # débitos internos (tarjeta, cheques)
  incoming_transfers_per_month: [1, 3]

  # Las bandas de IV son priors expertos del Excel ("to be validated with IV / SHAP"). En este
  # grupo el mismo dinero se mide en bruto (#7) y en neto (#23), así que se acepta una
  # tolerancia de ±0.03 alrededor de la banda (D-18); fuera de ella, falla.
  iv_tolerance: 0.03
  targets:
    external_transfer_pct_of_balance_60d: {alert: "> 0.15", rate: [0.04, 0.16], iv: [0.30, 0.50], strength: Very high, iv_base: all, driver: mixed}
    new_external_destinations_90d:        {alert: ">= 1",   rate: [0.02, 0.15], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed}
    transfer_to_competitor_pct_90d:       {alert: "> 0.10", rate: [0.03, 0.14], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed}
    external_transfer_acceleration:       {alert: "accel",  rate: [0.02, 0.12], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: mixed}
    net_external_flow_pct_90d:            {alert: "<= -0.15", rate: [0.04, 0.20], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed}
    external_destination_concentration:   {alert: "hhi",    rate: [0.02, 0.15], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: mixed}
    # Forma en U (D-18): riesgo alto al inicio de la mudanza (> +100%) y al terminarla (≈ −100%
    # frente a una línea base inflada por los tramos previos). Se valida con IV y lift, no con tendencia lineal.
    outflow_vs_baseline_pct:              {alert: "> 1.0",  rate: [0.03, 0.15], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed, shape: u}

# ---------------------------------------------------------------------------
# Paso 4 · Investments (variables 9, 26, 27, 28, 34)
# ---------------------------------------------------------------------------
# Se construye sobre las series del Paso 1 (AUM, retiros, aportes, rendimientos) y el
# evento de mudanza. Lo nuevo aquí cambia la COMPOSICIÓN del portafolio (ventas a cash,
# vencimientos, posiciones), no los dólares que entran o salen del AUM.
step4:
  # Benchmark asignado por perfil (IPS): beta objetivo = beta real + desvío (tilt).
  benchmark_tilt_sigma: 0.08               # [Supuesto]
  # SEÑAL factor: venta a cash sin reinvertir (paso previo a transferir).
  liquidation_intercept: -3.6              # [Calibrado]
  liquidation_slope: 1.7                   # [Calibrado] sobre z_outflow
  liquidation_share: [0.15, 0.60]          # fracción del AUM vendida a cash
  liquidation_window_days: 150
  liquidation_full_position_share_beta: [1.5, 4.0]   # parte vendida en posiciones completas (#34)
  # SEÑAL propensión: antes del ACATS se liquidan los fondos propietarios (el custodio nuevo no los acepta).
  proprietary_p: 0.50                      # [Supuesto] no todos tienen fondos propietarios
  proprietary_share: [0.05, 0.25]
  proprietary_sale_lead_days: [0, 30]
  # RUIDO: de-risking recomendado por el banker (sube el cash; origen asesor → no cuenta en #9).
  advisor_derisk_p: 0.05                   # [Supuesto]
  advisor_derisk_pp: [0.05, 0.15]
  # RUIDO: rebalanceos del asesor (compra y venta por igual; excluidos de #9 y #34).
  rebalance_p_month: 0.15
  rebalance_share: [0.02, 0.10]
  # RUIDO: venta completa de una posición por el cliente, sin reemplazo.
  client_full_sale_p_90d: 0.08
  client_full_sale_share: [0.01, 0.06]
  rmd_age: 73                              # RMD de diciembre: excluida de #9
  rmd_rate: 0.04
  cash_noise_pp_monthly: 0.01
  # Renta fija: vencimientos en 90 días y reinversión en 30 días.
  maturity_p_90d_given_fi: 0.30            # [Supuesto]
  maturity_share_of_fi: [0.05, 0.30]
  reinvest_full_p: 0.65                    # [Supuesto] reinversión normal completa
  reinvest_partial_beta: [2.0, 2.0]
  nonreinvest_liquidation_p: 0.85          # si el hogar está liquidando / mudándose, no reinvierte
  iv_tolerance: 0.03                       # política general desde el Paso 3 (D-18): bandas = priors expertos
  targets:
    investment_redemption_pct:            {alert: "> 0.20",  rate: [0.02, 0.12], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: mixed}
    fixed_income_maturity_not_reinvested: {alert: "> 0.50",  rate: [0.10, 0.45], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: mixed}
    cash_pct_of_portfolio_chg:            {alert: "> 0.10",  rate: [0.03, 0.15], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: mixed}
    return_vs_benchmark:                  {alert: "<= -0.03", rate: [0.10, 0.40], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: factor}
    positions_liquidated_pct:             {alert: "> 0.15",  rate: [0.01, 0.10], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: mixed}

# ---------------------------------------------------------------------------
# Paso 5 · Relationship & closures (variables 10, 29, 30, 31, 32)
# ---------------------------------------------------------------------------
step5:
  # Productos de depósito y tarjeta (los demás salen de las banderas del Paso 0).
  p_savings: 0.70
  p_money_market: 0.50
  p_cd: 0.35
  p_credit_card: 0.60
  extra_accounts_poisson: {HNW: 0.4, UHNW: 1.2}   # cuentas adicionales por producto
  # SEÑAL propensión: quien se muda cierra productos 0–90 días después de la mudanza.
  move_close_p: {checking: 0.45, savings: 0.55, money_market: 0.55, cd: 0.40, brokerage: 0.60,
                 advisory: 0.60, credit_card: 0.35, credit_line: 0.20, business_account: 0.30}
  move_close_lag_days: [0, 90]
  # SEÑAL factor: un episodio de salida cierra ahorro / money market.
  episode_close_p: 0.30
  # RUIDO incluido (cuenta como cierre): CD que vence y no se renueva, cierre ocasional.
  cd_maturity_p_90d: 0.12
  cd_renewed_p: 0.70                        # renovado → excluido
  random_close_p_90d: 0.01
  # RUIDO excluido por el Excel: préstamo pagado a término, conversión / upgrade, consolidación interna.
  loan_paid_at_term_p_90d: 0.02
  conversion_p_90d: 0.02
  consolidation_p_90d: 0.03
  # Share of wallet: logit(SOW verdadero) = a − b · z_outflow + ruido.
  sow_logit_intercept: 0.0                  # [Supuesto] SOW mediano ≈ 50%
  sow_logit_zout: 0.30                      # [Calibrado]
  sow_logit_noise: 0.90
  wealth_sources: {declared: 0.40, vendor: 0.45, model: 0.15}
  wealth_noise_sigma: {declared: 0.10, vendor: 0.35, model: 0.50}
  estimate_updated_6m_p: 0.10               # si se reestimó, el cambio de SOW refleja la nueva estimación
  # Trustee: mudanza (propensión), servicio (factor) y ruido; sucesión por muerte = exclusión.
  trustee_move_p: 0.40
  trustee_service_intercept: -4.5
  trustee_service_slope: 0.8
  trustee_noise_p_12m: 0.01
  trustee_death_succession_p_12m: 0.01
  iv_tolerance: 0.03
  targets:
    # Ventana de 180 días como principal (el Excel lista 90d y 180d): los cierres por mudanza
    # llegan meses después del traslado; a 90 días el IV es ≈ 0.23.
    products_closed_180d:    {alert: ">= 1",     rate: [0.03, 0.15], iv: [0.30, 0.50], strength: Very high, iv_base: all, driver: mixed}
    accounts_closed_90d:     {alert: ">= 1",     rate: [0.04, 0.20], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed}
    share_of_wallet:         {alert: "<= 0.30",  rate: [0.10, 0.40], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed}
    share_of_wallet_change:  {alert: "<= -0.10", rate: [0.03, 0.20], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed}
    trustee_change_flag:     {alert: "= 1",      rate: [0.01, 0.08], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: mixed}

# ---------------------------------------------------------------------------
# Paso 6 · Banker (variables 11, 12, 13, 35)
# ---------------------------------------------------------------------------
step6:
  book_size: {HNW: 60, UHNW: 25}
  # Las carteras se arman por calidad (índice de riesgo + ruido): hay libros mejores y peores.
  book_sort_noise: 0.5                      # [Calibrado]
  # Salida del banker (decisión por banker): P = logit⁻¹(a + b · riesgo medio del libro estandarizado).
  departure_intercept: -3.2                 # [Calibrado] ≈ 10% de bankers en 6 meses
  departure_slope: 2.0                      # [Calibrado]
  client_request_intercept: -4.2            # cambio pedido por el cliente (z_service)
  client_request_slope: 0.9
  rebalance_p_6m: 0.03                      # ruido: rebalanceo de carteras
  temporary_coverage_p_6m: 0.05             # excluida (< 30 días)
  cadence_days: {HNW: 90, UHNW: 30}         # [Excel · Parameters]
  # Contacto: tasa de contactos del banker ∝ (1 / cadencia) · diligencia · exp(−β · z_neglect).
  banker_diligence_sigma: 0.30
  contact_neglect_loading: 0.80             # [Calibrado]
  outreach_per_cadence: 2.5                 # contactos del banker por período de cadencia
  channel_mix: {call: 0.45, email: 0.30, message: 0.25}
  call_minutes_median: 12
  call_minutes_sigma: 0.8
  mass_mailings_per_90d: 2                  # excluidos
  reply_intercept: 0.9                      # P(respuesta ≤ 7 días) = logit⁻¹(a − b · z_neglect)
  reply_neglect_slope: 1.1                  # [Calibrado]
  reply_after_move_factor: 0.4              # quien se está mudando deja de contestar
  welcome_call_p: 0.70                      # tras un cambio de banker, dentro de 14 días
  meetings_per_6m: {HNW: 2, UHNW: 6}
  cancel_intercept: -2.2                    # P(cancelada por el cliente) = logit⁻¹(a + b · z_neglect)
  cancel_neglect_slope: 0.8                 # [Calibrado]
  cancel_after_move_add: 1.5
  cancelled_by_captured_p: 0.40             # solo 40% de los bankers registra "cancelado por"
  iv_tolerance: 0.03
  targets:
    banker_change_6m_flag:         {alert: "= 1",    rate: [0.05, 0.20], iv: [0.30, 0.50], strength: Very high, iv_base: all, driver: mixed}
    contact_gap_ratio:             {alert: "> 2.0",  rate: [0.02, 0.25], iv: [0.10, 0.30], strength: High, iv_base: all, driver: factor}
    client_reply_rate:             {alert: "< 0.5",  rate: [0.05, 0.35], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: mixed}
    meetings_cancelled_by_client:  {alert: ">= 2",   rate: [0.03, 0.20], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: mixed}

# ---------------------------------------------------------------------------
# Paso 7 · Complaints & voice of client (variables 14, 15, 33, 36)
# ---------------------------------------------------------------------------
step7:
  # Quejas de 12 meses: nº ~ Poisson(λ), λ = base · exp(b_S · z_service + b_N · z_neglect).
  complaint_base_rate_12m: 0.07             # [Calibrado] ≈ 16% de hogares con queja al año
  complaint_service_loading: 1.40           # [Calibrado] pocos se quejan, y esos repiten
  complaint_neglect_loading: 0.30
  # Taxonomía nivel 2 (probabilidad base) y SLA en días.
  categories: {fees_pricing: 0.18, process_delay: 0.20, banker_attention: 0.14, digital: 0.14,
               transfers_wires: 0.10, statement_error: 0.08, investment_performance: 0.10, fraud_dispute: 0.06}
  sla_days: {fees_pricing: 20, process_delay: 30, banker_attention: 15, digital: 10,
             transfers_wires: 10, statement_error: 15, investment_performance: 30, fraud_dispute: 45}
  # Ruido independiente del riesgo: fraude y errores de estado de cuenta.
  noise_complaints_12m: 0.04
  noise_categories: [fraud_dispute, statement_error]
  # Queja por demora de ACATS entre quienes se mudan (propensión).
  acats_complaint_p: 0.20
  resolution_median_days: 16
  resolution_sigma: 0.9
  resolution_service_loading: 0.60          # las quejas de clientes con S alto tardan más
  escalation_intercept: -2.6                # P(escalada) = logit⁻¹(a + b · z_service + c · fuera de SLA)
  escalation_service_slope: 0.6
  escalation_out_of_sla_add: 1.2
  escalation_levels: {management: 0.55, ombudsman: 0.15, regulator: 0.20, legal: 0.10}
  reopen_intercept: -2.8
  reopen_service_slope: 0.9
  # Assistant (#36): piloto con 30% de hogares desde hace 60 días; sin historia para el resto (NULL).
  assistant_pilot_p: 0.30
  assistant_live_days: 60
  dissatisfaction_intercept: -3.6           # estado real de insatisfacción (30 días)
  dissatisfaction_service_slope: 1.3
  dissatisfaction_neglect_slope: 0.5
  dissatisfaction_move_add: 3.0             # quien se está mudando lo expresa ("moving my money")
  assistant_usage_30d_p: 0.60               # conversó con el Assistant en los últimos 30 días
  classifier_tpr: 0.80                      # con confianza ≥ 0.75
  classifier_fpr: 0.02
  human_confirm_tp: 0.95
  human_confirm_fp: 0.10
  iv_tolerance: 0.03
  targets:
    complaint_escalated_flag:          {alert: "= 1",  rate: [0.01, 0.08], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed}
    complaint_age_days:                {alert: "> 30", rate: [0.005, 0.06], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed}
    repeat_complaint_flag:             {alert: "= 1",  rate: [0.01, 0.08], iv: [0.10, 0.30], strength: High, iv_base: all, driver: mixed}
    relationship_dissatisfaction_flag: {alert: "= 1",  rate: [0.005, 0.06], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: mixed}

# ---------------------------------------------------------------------------
# Paso 8 · External & composite (variables 16, 37)
# ---------------------------------------------------------------------------
step8:
  # #16: grupos del Excel con alguna variable sobre su umbral de alerta; flag si ≥ 3 de 7.
  multi_signal_min_groups: 3
  material_not_reinvested_usd: 100_000     # "> 50% and material amount" (#26)
  # #37 buró: hipoteca / HELOC nueva con otro acreedor en 6 meses.
  legal_cleared: true                      # interruptor: false → la variable queda NULL (FCRA)
  permissible_purpose_p: 0.95              # revisión de cuenta existente con registro de propósito permisible
  move_mortgage_elsewhere_p: 0.40          # [Calibrado] propensión: el banco nuevo ofrece hipoteca
  home_purchase_financed_p: 0.60           # compra de casa del Paso 3 financiada
  citizens_lender_p: {anchor: 0.60, no_anchor: 0.25}   # si financia, con Citizens (no cuenta) o con otro
  refinance_elsewhere_p_6m: 0.008          # [Calibrado] ruido
  iv_tolerance: 0.03
  targets:
    # Compuesta de 35 variables: se espera más IV que cualquier variable sola (banda propia).
    multi_signal_count:            {alert: ">= 3", rate: [0.03, 0.30], iv: [0.30, 0.80], strength: High (compuesta), iv_base: all, driver: mixed}
    bureau_new_mortgage_elsewhere: {alert: "= 1",  rate: [0.005, 0.06], iv: [0.10, 0.30], strength: High, iv_base: applicable, driver: mixed}

# ---------------------------------------------------------------------------
# Resultado · construcción de la variable de churn (ventana (t, t+6m])
# ---------------------------------------------------------------------------
# Se simulan los 6 meses posteriores al corte (saldos y AUM) y la etiqueta se construye
# con las definiciones del deck sobre lo observado, como lo haría el banco.
outcome:
  months: 6
  hard_churn_residual_share: [0.0, 0.03]    # saldo que queda tras la salida total
  hard_churn_max_share: 0.05                # etiqueta: valor ≤ 5% del valor en t y se mantiene hasta t+6
  soft_churn_threshold: 0.20                # etiqueta: caída ex-mercado > 20% en 3 meses sin salida total
  soft_churn_window_months: 3
  deposit_sigma_monthly: 0.12               # igual que el Paso 1
  aum_net_flow_sigma_monthly: 0.02
  liquidity_shock_p_month: 0.01             # ruido que puede parecer contracción (compra de casa, impuestos)
  liquidity_shock_size_median: 0.30
  liquidity_shock_size_sigma: 0.5
