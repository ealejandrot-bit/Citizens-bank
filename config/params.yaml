# Parámetros de la base sintética Client Pulse.
# Cada supuesto lleva su origen: [Excel] hoja del Excel, [Deck] slide del deck,
# [Supuesto] valor nuestro pendiente de validar con Citizens (ver docs/decisiones.md).

master_seed: 20260928          # Única semilla del proyecto; todo deriva de aquí.
n_households: 20000            # [Supuesto] Tamaño suficiente para IV/WoE y ML estable.
snapshot_date: "2025-12-31"    # [Excel · Base definitions] t = corte mensual.
currency: USD                  # Banco de EE. UU.: todos los montos en dólares nominales, sin FX.

# ---------------------------------------------------------------------------
# Paso 0 · Población de hogares
# ---------------------------------------------------------------------------
population:
  # Valor total de la relación (AUM + depósitos) ~ LogNormal.
  # Mediana $4M, sigma 1.2 -> media ≈ $8.2M, cola pesada (UHNW ≈ 4-5%).
  relationship_value_median: 4_000_000     # [Supuesto]
  relationship_value_sigma: 1.2            # [Supuesto]
  relationship_value_min: 1_000_000        # [Supuesto] piso de Private Bank.
  uhnw_threshold: 30_000_000               # [Deck · slide 69] "UHNW (above $30M)".
  # Cola Pareto sobre el umbral UHNW (riqueza real ≈ Pareto, α ≈ 1.5). Se conserva
  # P(valor ≥ $30M) de la LogNormal; por encima, Pareto truncada en [$30M, tope].
  pareto_tail_alpha: 1.5                   # [Supuesto] ajuste D-13.
  pareto_tail_max: 1_000_000_000           # [Supuesto] tope: evita varianza infinita.

  # Hogares sin cuentas de inversión (solo depósitos): variables de
  # inversión quedan NULL, no cero [Excel · Base definitions "Null vs. zero"].
  # P(solo depósitos) cae con el patrimonio (ajuste D-13):
  # logit p = logit(p_en_mediana) + pendiente · lv, con lv = log-valor estandarizado.
  # ≈ 31% a $1M, 15% a $4M, 4% a $30M.
  deposit_only_p_at_median: 0.15           # [Supuesto]
  deposit_only_slope: -0.80                # [Supuesto]
  # Proporción de depósitos en hogares con inversión ~ Beta(a, b) (media ≈ 0.29).
  deposit_share_beta: [2.0, 5.0]           # [Supuesto]

  # Edad del titular principal ~ Normal truncada.
  age_mean: 61                             # [Supuesto]
  age_sd: 12                               # [Supuesto]
  age_bounds: [28, 95]

  # Antigüedad con el banco (años) ~ Gamma(shape, scale), media = shape*scale.
  tenure_gamma: [2.0, 4.5]                 # [Supuesto] media 9 años.
  tenure_max_years: 50                     # [Supuesto] tope de cola.
  # Meses de historia disponible para la base: min(tenure, 24m) [Deck · slide 20].
  history_months_cap: 24

  # Entidades vinculadas [Excel · Base definitions "Aggregation level"].
  # Probabilidad base y aumento para UHNW.
  p_linked_business: 0.25                  # [Supuesto]
  p_linked_business_uhnw: 0.55             # [Supuesto]
  p_trust: 0.30                            # [Supuesto]
  p_trust_uhnw: 0.70                       # [Supuesto]
  # Cuentas advisory (con benchmark asignado) entre hogares con inversión.
  p_advisory_given_investments: 0.70       # [Supuesto]
  # Crédito con Citizens (hipoteca / línea) = "credit anchor" [Deck · slide 26].
  p_credit_anchor: 0.35                    # [Supuesto]

  # Perfil de ingresos recurrentes (determina a quién aplican las variables
  # salary_/pension_/business_payroll_stopped_flag).
  p_payroll_if_working: 0.80               # [Supuesto] trabajan: edad < retirement_age.
  p_payroll_if_retired: 0.10               # [Supuesto]
  p_pension_if_retired: 0.85               # [Supuesto]
  p_pension_if_working: 0.05               # [Supuesto]
  p_dividend_stream_given_investments: 0.55  # [Supuesto]
  retirement_age: 65                       # [Supuesto]

# ---------------------------------------------------------------------------
# Paso 0 · Montos de ingreso (Private Banking: ingresos altos)
# ---------------------------------------------------------------------------
# Todos los montos crecen con el patrimonio: ln(monto) = ln(mediana) +
# ρ·σ·lv + σ·√(1−ρ²)·ε, con lv = log-valor de la relación estandarizado.
# Así ρ ≈ correlación entre log-ingreso y log-patrimonio. Los pisos se aplican
# remuestreando ε (no recortando, para no apilar masa en el piso).
income:
  # Sueldo base anual de quienes reciben nómina en Citizens.
  salary_base_median: 350_000              # [Supuesto] profesionales / ejecutivos PB.
  salary_sigma: 0.55                       # [Supuesto] p5 ≈ $150k, p95 ≈ $850k antes del ajuste por patrimonio.
  salary_wealth_corr: 0.45                 # [Supuesto]
  salary_min: 150_000                      # [Supuesto] piso de nómina PB.
  # Bono anual como % del sueldo base = bonus_max × Beta(a, b) (media ≈ 50%).
  # Llega en un solo pago al año: rompe la regularidad de la nómina y la
  # detección de flujos recurrentes debe tratarlo aparte (Paso 2).
  # Ajuste D-13: masa de "sin bono" (bono = 0, no NULL) y piso para quien sí recibe.
  # Bono = sueldo × [min + (max − min) · Beta(a, b)]  → media ≈ 57% entre quienes reciben.
  p_no_bonus: 0.25                         # [Supuesto] médicos, abogados socios, etc.
  bonus_share_min: 0.10                    # [Supuesto]
  bonus_share_beta: [1.5, 3.0]             # [Supuesto]
  bonus_share_max: 1.5                     # [Supuesto]
  pay_frequency: {biweekly: 0.40, semimonthly: 0.45, monthly: 0.15}   # [Supuesto]
  # Pensión mensual: Social Security (máx ≈ $5k) + pensión privada / anualidad.
  pension_monthly_median: 9_000            # [Supuesto]
  pension_sigma: 0.50                      # [Supuesto]
  pension_wealth_corr: 0.30                # [Supuesto]
  pension_monthly_min: 2_500               # [Supuesto]
  # Dividendos = AUM × rendimiento ~ Beta (media 2%), pagos trimestrales.
  dividend_yield_beta: [4.0, 196.0]        # [Supuesto]
  # Distribuciones anuales del negocio vinculado al dueño (trimestrales, irregulares).
  business_distribution_median: 500_000    # [Supuesto]
  business_distribution_sigma: 0.90        # [Supuesto]
  business_distribution_wealth_corr: 0.50  # [Supuesto]

# ---------------------------------------------------------------------------
# Paso 0 · Estructura latente de riesgo (tres trayectorias del deck)
# ---------------------------------------------------------------------------
# [Deck · slide 24] Trayectorias: outflow-led, silent drift, service-triggered.
# Cada hogar tiene tres factores latentes N(0,1) correlacionados. Las variables
# de los pasos siguientes se generan desde estos factores + ruido propio; el
# target también. Nunca se generan variables a partir del target (evita fuga).
latent:
  factors: [outflow, neglect, service]
  correlation:                             # [Supuesto] correlación moderada
    - [1.00, 0.35, 0.25]
    - [0.35, 1.00, 0.30]
    - [0.25, 0.30, 1.00]
  # Peso de cada factor en el índice de riesgo.
  risk_weights: {outflow: 0.60, neglect: 0.45, service: 0.35}   # [Supuesto]
  # Desplazamientos estructurales (en unidades del índice de riesgo).
  tenure_effect_per_log_year: -0.15        # [Supuesto] más antigüedad -> menos riesgo.
  credit_anchor_effect: -0.20              # [Supuesto] [Deck · slide 26]
  uhnw_effect: 0.10                        # [Supuesto] ligero, para que AUM churn ≠ logo churn.
  # Riesgo idiosincrático no observable: limita el AUC alcanzable (score realista).
  idiosyncratic_sd: 0.60                   # [Supuesto]

# ---------------------------------------------------------------------------
# Distribuciones comunes a los pasos 1+
# ---------------------------------------------------------------------------
distributions:
  # Ruido de colas pesadas de los cambios % y flujos: t-Student estandarizada a
  # varianza 1. ν = 6 (D-11): curtosis de exceso 3, finita y estable. ν = 4 da infinita.
  t_df: 6

# ---------------------------------------------------------------------------
# Paso 0 · Target
# ---------------------------------------------------------------------------
target:
  # [Deck · slide 17] Ejemplo: 3% logo churn por trimestre; score medio 8% a 6m.
  hard_churn_6m_rate: 0.06                 # [Supuesto anclado al deck]
  hard_churn_slope: 1.6                    # [Supuesto] pendiente logística sobre el índice.
  # [Deck · slide 16/23] Soft churn = caída de AUM > umbral en 3m, sin salida total.
  soft_churn_threshold: 0.20               # [Deck] "AUM drop >20%" (a validar).
  soft_churn_3m_rate: 0.09                 # [Supuesto] sobre hogares elegibles; hard y soft son excluyentes.
  soft_churn_slope: 1.2                    # [Supuesto]
  # Fracción de la relación perdida en soft churn ~ Uniforme.
  soft_churn_loss_range: [0.20, 0.60]
  # Exclusiones (no cuentan como churn) [Deck · slide 59]: muerte, reubicación
  # gestionada por Legacy. Se marcan y su target queda NULL.
  exclusion_rate: 0.006                    # [Supuesto]

# ---------------------------------------------------------------------------
# Paso 1 · Balances & AUM (series mensuales → variables 1, 2, 17, 18)
# ---------------------------------------------------------------------------
# Serie de 24 meses (m = −23..0; 0 = mes que cierra en t), anclada al Paso 0:
# el saldo de depósitos y el AUM del mes 0 son los del Paso 0. Se simula hacia
# atrás, así ningún valor del Paso 0 cambia. Ventanas del Excel en días →
# meses: 30d = 1, 90d = 3, 180d = 6, línea base (t−210d, t−30d] = meses −6..−1.
step1:
  months: 24
  min_balance_for_pct: 10_000              # [Excel · Parameters] saldo mínimo para %.
  # Depósitos: incrementos log mensuales = μ + σ · t(ν) estandarizada.
  deposit_drift_monthly: 0.002             # [Supuesto]
  deposit_sigma_monthly: 0.05              # [Supuesto]
  # Mercado común a todos los hogares (una draw por mes): μ + σ · t(ν) estandarizada.
  market_mu_monthly: 0.006                 # [Supuesto] ≈ 7% anual.
  market_sigma_monthly: 0.040              # [Supuesto] ≈ 14% anual.
  equity_share_range: [0.30, 1.00]         # [Supuesto] beta del portafolio al mercado.
  non_equity_return_monthly: 0.003         # [Supuesto] renta fija / cash.
  idio_return_sigma: 0.010                 # [Supuesto]
  # Flujos de fondo del AUM (fracción del AUM del mes previo), tipo hurdle.
  contribution_p: 0.12                     # [Supuesto] P(aporte en el mes)
  contribution_median: 0.02                # [Supuesto]
  withdrawal_p: 0.20                       # [Supuesto] retiros para gasto corriente
  withdrawal_median: 0.01                  # [Supuesto]
  flow_sigma: 0.80                         # [Supuesto] σ log de los montos
  # Episodio de salida (SEÑAL): P = logit⁻¹(a + b · z_outflow), duración 1–6 meses
  # hasta t, intensidad mensual δ ~ LogNormal. Afecta depósitos y AUM.
  episode_intercept: -3.0                  # [Calibrado] tasa base de episodios (≈ 14%)
  episode_slope: 2.2                       # [Calibrado] fuerza predictiva (IV)
  episode_max_months: 6
  episode_delta_median: 0.14               # [Calibrado] ≈ 14% mensual antes del multiplicador de canal
  episode_delta_sigma: 0.50
  episode_channel_range_deposit: [1.0, 2.0] # [Calibrado] multiplicador de δ en depósitos
  episode_channel_range_aum: [0.3, 1.1]    # [Calibrado] multiplicador de δ en AUM
  # Choque de liquidez (RUIDO, independiente del riesgo): impuestos, compra de casa.
  shock_p_12m: 0.10                        # [Supuesto]
  shock_size_median: 0.25                  # [Supuesto] fracción que sale en el mes
  shock_size_sigma: 0.50
  shock_hits_aum_p: 0.50                   # [Supuesto]
  # Objetivos de calibración. Alerta = umbral ilustrativo del Excel; la tasa es un rango
  # porque aum_outflow_pct (retiros brutos ÷ AUM promedio) siempre alerta más que
  # aum_vs_baseline_pct (caída neta ex-mercado) ante el mismo episodio.
  # IV "High" del Excel → [0.10, 0.30] contra hard_churn_6m.
  targets:
    aum_outflow_pct_90d:            {alert: "> 0.10",   rate: [0.06, 0.16], iv: [0.10, 0.30]}
    deposit_balance_change_pct_90d: {alert: "<= -0.25", rate: [0.06, 0.14], iv: [0.10, 0.30]}
    aum_vs_baseline_pct:            {alert: "<= -0.20", rate: [0.05, 0.12], iv: [0.10, 0.30]}
    deposit_balance_vs_6m_avg_pct:  {alert: "<= -0.30", rate: [0.05, 0.14], iv: [0.10, 0.30]}
